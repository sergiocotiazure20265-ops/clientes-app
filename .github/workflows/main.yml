name: Pipeline Node.js - AWS Elastic Beanstalk

on:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  AWS_REGION: us-east-2
  EB_APPLICATION_NAME: clientes-app
  EB_ENVIRONMENT_NAME: Clientes-app-env

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Instalar dependências sem gerar package-lock.json
        run: npm install --package-lock=false

      - name: Executar build
        run: |
          echo "Executando o BUILD da aplicação clientes-app..."
          npm run build --if-present

      - name: Validar arquivo de entrada
        run: |
          if [ -f "server.js" ]; then
            node --check server.js
            echo "Arquivo server.js validado."
          elif [ -f "index.js" ]; then
            node --check index.js
            echo "Arquivo index.js validado."
          else
            echo "ERRO: nenhum arquivo server.js ou index.js encontrado."
            exit 1
          fi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Executar testes simulados
        run: |
          echo "Aplicação: clientes-app"
          echo "Por enquanto, os testes estão simulados."
          echo "Nenhum teste automatizado foi executado."

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Baixar o código do projeto
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Elastic Beanstalk CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Verificar instalação da EB CLI
        run: eb --version

      - name: Configurar credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Inicializar configuração do Elastic Beanstalk
        run: |
          eb init "$EB_APPLICATION_NAME" \
            --region "$AWS_REGION" \
            --platform node.js

      - name: Realizar deploy no Elastic Beanstalk
        run: |
          echo "Iniciando deploy da aplicação $EB_APPLICATION_NAME..."
          echo "Ambiente: $EB_ENVIRONMENT_NAME"
          echo "Região: $AWS_REGION"

          eb deploy "$EB_ENVIRONMENT_NAME" \
            --label "v-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA::7}" \
            --timeout 20

      - name: Consultar status do ambiente
        run: eb status "$EB_ENVIRONMENT_NAME"
